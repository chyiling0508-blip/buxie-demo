<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會員登入｜不謝花房｜氣球花束訂閱</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { background: var(--cream-100); }
  .login-page {
    min-height: 100vh; padding: 32px 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  }
  .login-page .footer-links { max-width: 880px; width: 100%; justify-content: center; }
  .login-card {
    width: 100%; max-width: 880px; background: var(--paper); padding: 40px;
    display: grid; grid-template-columns: 1fr;
    gap: 48px; align-items: center;
  }
  /* 窄螢幕單欄、表單在前；夠寬才左圖右表單 */
  .login-form { order: -1; }
  @media (min-width: 840px) {
    .login-card { grid-template-columns: 1fr 1fr; }
    .login-form { order: 0; }
  }
  .login-photo { margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .login-photo img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; background: var(--cream-100); }
  .login-photo figcaption { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: 1.33px; }
  .login-form { width: 100%; max-width: 360px; min-width: 0; justify-self: center; }
  .login-head { align-items: center; text-align: center; }
  .wordmark { font-weight: 700; font-size: 22px; letter-spacing: 4px; color: var(--ink-900); }
  .wordmark:hover { color: var(--ink-900); }
  .or { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; font-size: 12px; color: var(--taupe-500); }
  .or::before, .or::after { content: ''; height: 1px; background: var(--taupe-200); }
  .code-row .field { min-width: 0; }
  .print .demo-bar { display: none; }
  /* 列印版內嵌（login.html?print）：固定左圖右表單，高度不撐滿螢幕 */
  .print .login-page { min-height: 0; }
  .print .login-card { grid-template-columns: 1fr 1fr; }
  .print .login-form { order: 0; }
  @media (max-width: 420px) { .login-card { padding: 24px 20px; gap: 32px; } }
</style>
</head>
<body>
<div class="demo-bar" role="note">DEMO 展示版：登入為模擬，輸入任何內容都會成功，不會連到 Google 或發送簡訊。</div>
<div class="login-page">
  <div class="login-card">
    <figure class="login-photo">
      <img src="assets/bouquet-rose-tulip.jpg" alt="玫瑰鬱金香氣球花束" width="727" height="1024">
      <figcaption><span>BX-01</span><span class="muted">小束 · 5 朵</span></figcaption>
    </figure>

    <form class="login-form stack gap-20" id="login-form" novalidate>
      <div class="login-head stack gap-10">
        <a class="wordmark" href="index.html">不謝花房</a>
        <div class="eyebrow bouquet">氣球花束訂閱 · 會員登入</div>
        <div class="lede">登入後自動套用會員價，每束少 $50。</div>
      </div>

      <button class="btn lg secondary block" type="button" data-login>使用 Google 帳號登入</button>

      <div class="or">或</div>

      <div class="chips" style="justify-content:center" role="group" aria-label="登入方式">
        <button type="button" class="chip" data-by="手機" aria-pressed="true">手機登入</button>
        <button type="button" class="chip" data-by="Email" aria-pressed="false">Email登入</button>
      </div>

      <div class="stack gap-20" id="by-phone">
        <label class="field"><span>手機號碼</span><input name="phone" type="tel" placeholder="0912 345 678" autocomplete="tel"></label>
        <div class="code-row">
          <label class="field"><span>簡訊驗證碼</span><input name="code" inputmode="numeric" placeholder="6 位數" autocomplete="one-time-code"></label>
          <button class="btn secondary" type="button" id="send-code">取得驗證碼</button>
        </div>
      </div>
      <div class="stack gap-20" id="by-email" hidden>
        <label class="field"><span>Email</span><input name="email" type="email" placeholder="name@example.com" autocomplete="email"></label>
        <label class="field"><span>密碼</span><input name="password" type="password" autocomplete="current-password"></label>
        <div class="small" style="text-align:right"><a href="index.html#contact">忘記密碼</a></div>
      </div>

      <div class="notice" id="done" role="status" hidden>
        <div class="notice-title">已登入</div>
        <div>會員價已套用，接著前往訂閱方案。</div>
      </div>
      <button class="btn lg block" type="submit">登入</button>

      <div class="small" style="color:var(--ink-600);text-align:center;border-top:1px solid var(--taupe-200);padding-top:14px">還不是會員？<a href="index.html#join" style="font-weight:700">加入會員</a></div>
      <div style="font-size:12px;line-height:1.7;color:var(--taupe-500);text-align:center">全品項接單製作，無現貨。氣球會自然消氣、褪色，屬非長期保存品。</div>
    </form>
  </div>
  <nav class="footer-links" aria-label="全站連結">
    <a href="index.html#home">首頁</a>
    <a href="index.html#plans">訂閱方案</a>
    <a href="index.html#faq">常見問題</a>
    <a href="index.html#contact">聯絡我們</a>
    <a href="index.html#join">加入會員</a>
    <a href="index.html#map">網站架構</a>
  </nav>
</div>
<script src="mock-api.js"></script>
<script>
(function () {
  // 列印版內嵌時，把頁面高度回報給外層，讓框架撐到剛好的高度
  if (/[?&]print\b/.test(location.search)) {
    document.documentElement.classList.add('print');
    var report = function () {
      parent.postMessage({ bxLoginHeight: document.documentElement.scrollHeight }, '*');
    };
    window.addEventListener('load', report);
    if (document.fonts) document.fonts.ready.then(report);
  }

  var chips = document.querySelectorAll('[data-by]');
  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      var by = chip.getAttribute('data-by');
      chips.forEach(function (c) { c.setAttribute('aria-pressed', String(c === chip)); });
      document.getElementById('by-phone').hidden = by !== '手機';
      document.getElementById('by-email').hidden = by !== 'Email';
    });
  });

  // 展示版：驗證碼與登入都由 mock-api.js 回傳假結果，不會發簡訊、不會連到 Google
  document.getElementById('send-code').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    btn.textContent = '寄送中…';
    MockAPI.sendCode().then(function () { btn.textContent = '已寄出（示意）'; });
  });

  // 登入成功後記下會員身分，顯示提示後帶到訂閱方案（預設月繳）
  function login(method) {
    MockAPI.login(method).then(function () {
      try { localStorage.setItem('bx_member', '1'); } catch (e) {}
      document.getElementById('done').hidden = false;
      setTimeout(function () { location.href = 'index.html#plans'; }, 1200);
    });
  }
  document.querySelector('[data-login]').addEventListener('click', function () { login('Google'); });
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    login(document.querySelector('[data-by][aria-pressed="true"]').getAttribute('data-by'));
  });
})();
</script>
</body>
</html>
